<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#769656" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css?v=6" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Chess</h1>
        <p id="status" class="status">White to move</p>
      </header>

      <div class="controls">
        <div id="settings-summary" class="summary"></div>
        <button id="new-game" class="btn btn--primary">New Game</button>
      </div>

      <div class="layout">
        <div class="board-wrap">
          <div id="board" class="board"></div>
          <div id="promotion" class="promotion hidden"></div>
          <div id="overlay" class="overlay hidden">
            <div class="overlay__card">
              <h2 id="overlay-title">Checkmate</h2>
              <p id="overlay-text"></p>
              <button id="overlay-new" class="btn btn--primary">New Game</button>
            </div>
          </div>
        </div>

        <aside class="panel">
          <div class="captured">
            <div class="captured__row">
              <span class="captured__label">White</span>
              <span id="captured-w" class="captured__pieces"></span>
              <span id="adv-w" class="captured__adv"></span>
            </div>
            <div class="captured__row">
              <span class="captured__label">Black</span>
              <span id="captured-b" class="captured__pieces"></span>
              <span id="adv-b" class="captured__adv"></span>
            </div>
          </div>

          <div class="moves">
            <h2 class="moves__title">Moves</h2>
            <ol id="move-list" class="moves__list"></ol>
          </div>

          <div class="panel__actions">
            <button id="flip" class="btn">Flip</button>
            <button id="undo" class="btn">Undo</button>
            <button id="resign" class="btn">Resign</button>
          </div>
        </aside>
      </div>

      <div
        id="setup"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="setup-title"
      >
        <div class="modal__card">
          <h2 id="setup-title" class="modal__title">New Game</h2>
          <p id="setup-warning" class="modal__warning hidden">
            Starting a new game will end the current game.
          </p>

          <div class="field">
            <span class="field__label">Players</span>
            <div class="seg" id="setup-mode" role="group" aria-label="Players">
              <button class="seg__btn is-active" data-mode="1p">1 Player</button>
              <button class="seg__btn" data-mode="2p">2 Players</button>
            </div>
          </div>

          <div class="field" id="setup-level-field">
            <span class="field__label">Difficulty</span>
            <div class="seg seg--wrap" id="setup-level" role="group" aria-label="Difficulty">
              <button class="seg__btn" data-level="1">Beginner</button>
              <button class="seg__btn" data-level="2">Easy</button>
              <button class="seg__btn is-active" data-level="3">Medium</button>
              <button class="seg__btn" data-level="4">Hard</button>
              <button class="seg__btn" data-level="5">Expert</button>
            </div>
          </div>

          <div class="field" id="setup-side-field">
            <span class="field__label">Play as</span>
            <div class="seg" id="setup-side" role="group" aria-label="Play as">
              <button class="seg__btn is-active" data-side="w">White</button>
              <button class="seg__btn" data-side="b">Black</button>
              <button class="seg__btn" data-side="random">Random</button>
            </div>
          </div>

          <div class="modal__actions">
            <button id="setup-cancel" class="btn">Cancel</button>
            <button id="setup-start" class="btn btn--primary">Start Game</button>
          </div>
        </div>
      </div>
    </main>

    <script src="js/chess.js?v=6"></script>
    <script src="js/ai.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
  </body>
</html>
